# zoo-bench 测量矩阵
#
# 被测目标清单。两种写法都支持：
#   `包名==版本`                         —— PyPI 上已发布的版本
#   `包名 @ git+<仓库地址>@<分支/标签>`   —— 某个 git 引用的 HEAD
#
# **两者都要**：已发布版本是读者能装到的东西，仓库分支是"还没发但已经改了"的状态；
# 只测前者会让报告落后于开发，只测后者则报告里没有可安装的对应物。
#
# 跨版本对比只要两边的**留档**都在即可（`zoo-bench compare` 读留档，不重新测量），
# 所以上一版不必留在本清单里——它的数据已经在 results/ 下。
#
# 版本号必须真实存在（PyPI）或引用必须真实存在（git），否则安装失败。核对可用版本：
#   uv pip index versions zoo-framework
# 不要照抄框架仓库 pyproject.toml 里的版本号——实测它与 PyPI 上的发行版对不上。
#
# ------------------------------------------------------------------ 解释器维度（3.13t）
#
# free-threaded 列是**另一列对照**，不在本清单里加东西：它由 bench.yml 的
# free-threaded 阶段自动选取本清单的 **git 引用条目**（`@dev`）测量，留档在
# results/gil-free/。已发布版本声明 gevent 依赖、在 3.13t 上装不上，进不了这列。
# 读数口径只允许「同机同负载 3.13 vs 3.13t」；跨平台仍禁（design D6）。
# 判读门槛：中位收益 >=15% 才讨论把 3.13t 列为支持目标（沿用 DECISION.md 阈值）。
#
# ------------------------------------------------------------------ 加版本的正确顺序
#
# **先装上目标版本、重跑全套用例，通过之后才改这份清单。**
#
# 这条不是泛泛提醒，是这个仓库实际吃过的亏（2026-10-04）：当时先把 0.7.1b0 写进清单、后装它
# 跑用例，13 条立刻失败——`AttributeError: property 'workers' of 'BaseWaiter' object has no
# setter`。框架把派发面的 `workers` 从可写属性改成了只读属性，适配器是按上一代的写法驱动它的。
# 好在推送前发现，没有留下红的 CI。**判据本身（"追加版本必须重跑等价性用例"）是有效的，
# 错的是执行顺序**——先改清单，等于把"这一版能不能测"这个问题跳过去了。
#
# 装上跑一遍之所以是判据：它同时覆盖适配器契约、测量协议、语义探查三处对被测版本的假设。
frameworks:
  - "zoo-framework==0.6.0"
  # 适配器、语义探查均已按世代分流；这一条经全套用例通过后加入（见上方顺序纪律）
  - "zoo-framework==0.7.1b0"
  # 0.8.0 经全套用例通过后加入：驱动面与 0.7.x 同代（**能力探测判定，不看版本号**），
  # 故适配器无需改动
  - "zoo-framework==0.8.0"
  # 0.9.0 经全套用例通过后加入（325 passed，含 31 条适配器契约）；驱动面与 0.7.x / 0.8.0 同代
  # （**能力探测判定，不看版本号**），适配器无需改动
  - "zoo-framework==0.9.0"
  # dev 放在最后：**相邻配对决定对比页的配对**——这样生成的是「发布版→发布版」与
  # 「最新发布→开发中」，而不是把开发中的东西夹在两个发布版之间
  - "zoo-framework @ git+https://github.com/YearsAlso/zoo-framework.git@dev"

# 并发度档位
concurrency: [1, 4, 16, 64]

# 执行体耗时档位（微秒）。对应 bench/ 实测的 cpu-1x / cpu-10x / cpu-100x / io-10ms 四档。
body_tiers_us: [40, 300, 2700, 10000]

# 参与默认测量的适配器。
#
# **留空即"全部已登记适配器"**——刻意不在这里手维护一份清单：实测过它的代价，早先这份清单是
# 在 zoo 适配器存在之前写的，后来加了 zoo 却忘了同步，于是 CI 跑出的 80 个单元里**一个被测
# 对象都没有**（门禁拦住了那份报告，但理由说的是"没有不利数据"，误导排查方向）。
# 需要跑子集时再显式列出。
#
# 需外部服务的方案（celery）不受影响：它的可选依赖缺失时本就不会被登记（design D3）。
# adapters:
#   - zoo
#   - bare_thread
