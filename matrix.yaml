# zoo-bench 测量矩阵
#
# 被测目标清单。两种写法都支持：
#   `包名==版本`                         —— PyPI 上已发布的版本
#   `包名 @ git+<仓库地址>@<分支/标签>`   —— 某个 git 引用的 HEAD
#
# **两者都要**：已发布版本是读者能装到的东西，仓库分支是"还没发但已经改了"的状态；
# 只测前者会让报告落后于开发，只测后者则报告里没有可安装的对应物。
#
# 跨版本对比只要两边的**留档**都在即可（`zoo-bench compare` 读留档，不重新测量），
# 所以上一版不必留在本清单里——它的数据已经在 results/ 下。
#
# 版本号必须真实存在（PyPI）或引用必须真实存在（git），否则安装失败。核对可用版本：
#   uv pip index versions zoo-framework
# 不要照抄框架仓库 pyproject.toml 里的版本号——实测它与 PyPI 上的发行版对不上。
#
# ------------------------------------------------------------------ 解释器维度（3.13t）
#
# free-threaded 列是**另一列对照**，不在本清单里加东西：它由 bench.yml 的
# free-threaded 阶段自动选取本清单的 **git 引用条目**（`@dev`）测量，留档在
# results/gil-free/。已发布版本声明 gevent 依赖、在 3.13t 上装不上，进不了这列。
# 读数口径只允许「同机同负载 3.13 vs 3.13t」；跨平台仍禁（design D6）。
# 判读门槛：中位收益 >=15% 才讨论把 3.13t 列为支持目标（沿用 DECISION.md 阈值）。
#
# ------------------------------------------------------------------ 加版本的正确顺序
#
# **先装上目标版本、重跑全套用例，通过之后才改这份清单。**
#
# 这条不是泛泛提醒，是这个仓库实际吃过的亏（2026-10-04）：当时先把 0.7.1b0 写进清单、后装它
# 跑用例，13 条立刻失败——`AttributeError: property 'workers' of 'BaseWaiter' object has no
# setter`。框架把派发面的 `workers` 从可写属性改成了只读属性，适配器是按上一代的写法驱动它的。
# 好在推送前发现，没有留下红的 CI。**判据本身（"追加版本必须重跑等价性用例"）是有效的，
# 错的是执行顺序**——先改清单，等于把"这一版能不能测"这个问题跳过去了。
#
# 装上跑一遍之所以是判据：它同时覆盖适配器契约、测量协议、语义探查三处对被测版本的假设。
frameworks:
  - "zoo-framework==0.6.0"
  # 适配器、语义探查均已按世代分流；这一条经全套用例通过后加入（见上方顺序纪律）
  - "zoo-framework==0.7.1b0"
  # 0.8.0 经全套用例通过后加入：驱动面与 0.7.x 同代（**能力探测判定，不看版本号**），
  # 故适配器无需改动
  - "zoo-framework==0.8.0"
  # 0.9.0 经全套用例通过后加入（325 passed，含 31 条适配器契约）；驱动面与 0.7.x / 0.8.0 同代
  # （**能力探测判定，不看版本号**），适配器无需改动
  - "zoo-framework==0.9.0"
  # 0.10.0 经全套用例通过后加入（351 passed，含 31 条适配器契约）；驱动面与 0.7.x–0.9.0 同代
  # （**能力探测判定，不看版本号**），适配器无需改动。本版是 BREAKING 发布——运行依赖移除
  # gevent、删除 `event:sleep` 死键——但改动落在事件管道内部，未触及适配器驱动的派发面
  - "zoo-framework==0.10.0"
  # 0.11.0 经全套用例通过后加入（351 passed，含 31 条适配器契约）；驱动面与 0.7.x–0.10.0 同代
  # （**能力探测判定，不看版本号**），适配器无需改动。本版两项新能力**默认都不参与**测量：
  # 自适应调度（`adaptive:enabled` 默认 false）与原生任务执行（`native:enabled` 默认 false，
  # Rust 扩展为可选依赖、不随主包分发，缺席时既有功能不受影响）；其余改动落在派发内核
  # （waiter / scheduler_model）、事件管道与 FIFO / Reactor 内部，未触及适配器驱动的派发面
  - "zoo-framework==0.11.0"
  # dev 放在最后：**相邻配对决定对比页的配对**——这样生成的是「发布版→发布版」与
  # 「最新发布→开发中」，而不是把开发中的东西夹在两个发布版之间
  - "zoo-framework @ git+https://github.com/YearsAlso/zoo-framework.git@dev"

# 并发度档位
concurrency: [1, 4, 16, 64]

# 执行体耗时档位（微秒）。对应 bench/ 实测的 cpu-1x / cpu-10x / cpu-100x / io-10ms 四档。
body_tiers_us: [40, 300, 2700, 10000]

# 参与默认测量的适配器。
#
# **留空即"全部已登记适配器"**——刻意不在这里手维护一份清单：实测过它的代价，早先这份清单是
# 在 zoo 适配器存在之前写的，后来加了 zoo 却忘了同步，于是 CI 跑出的 80 个单元里**一个被测
# 对象都没有**（门禁拦住了那份报告，但理由说的是"没有不利数据"，误导排查方向）。
# 需要跑子集时再显式列出。
#
# 需外部服务的方案（celery）不受影响：它的可选依赖缺失时本就不会被登记（design D3）。
# adapters:
#   - zoo
#   - bare_thread

# ------------------------------------------------------------------ 原生任务线
#
# 该线是**主矩阵之外的独立探查线**（与语义探查、开销归因同级），对照被测框架的三种执行形态：
# 纯解释 / 原生扩展 / 由在线决策在两者间路由。它不进上面对 frameworks 的 96 单元展开——
# 那三档都是被测框架自己，"适配器 = 一个方案"的语义放不下它们。
#
# **删掉本节即关闭该线**（不测量、不归档、报告按"未开启"渲染），主矩阵与发布流程都不依赖它。
#
# 依赖原生扩展（`zoo-framework-native`），不在任何包索引上：由 CI 从框架仓**同 tag** 的子目录
# 构建安装（见 bench.yml）。扩展缺失/来源不对/两臂语义不等价时，该线以失败或"不适用"示人，
# **不影响**主矩阵与其余版本的测量与发布。
#
# `registers` 是**该任务的输入规模**（Modbus RTU 响应帧的寄存器个数），不是字节数——字节数是它的
# 推论（registers × 2 + 5）。三档取框架自身工作包络的两端：1 寄存器 = 7 字节（框架公开认定为
# 不划算的小规模）、8 寄存器 = 21 字节（框架公开的划算分界）、125 寄存器 = 255 字节（契约输入
# 上限内的最大合法帧）。要有"不划算到什么程度"与"划算到什么程度"两侧，才能回答"在哪划算"。
#
# **并发度沿用上面的 `concurrency`**（design D8），故这里不重复声明；判定只在最低那档上做，
# 理由见 `zoo_bench/native_line/line.py` 的模块说明。
#
# **采样粒度也是并发度**：一个并发度一个子进程，进程内把全部 (形态, 规模) 组合逐轮交替（ABBA，
# 顺序逐轮翻转）各跑一轮，故同规模上两形态的对照是**同一周期内的配对差**——规格要求「参与对照的
# 两侧来自同一次运行的同一次采样，MUST NOT 由两次运行的结果相减得出」。逐格一个进程的做法实测会
# 把进程间漂移（约 100 µs）读成形态差，而 21 字节档上两形态的真实差距只有几微秒；配对差把共同
# 漂移消在配对内部。理由见 `zoo_bench/native_line/measure.py` 的模块说明。
#
# `warmup_rounds` 不是随手取的 2：考察的两种形态里，**原生臂只能靠探索被首次尝试**——探索率
# 默认 0.05、探索时两臂等概率，故"首次走到原生臂"是均值 40 次提交的几何等待（实测：122 次提交
# 里最大规模一档仍一次没走到）。预热轮不进入统计，但**统计在预热期间照常累积**（同进程同类目），
# 故预热的作用是让路由在正式采样之前收敛。
#
# 取 100 是**按判定并发度定的**：只有判定那一档（最低并发度，即每轮提交一次）的次数稀缺，
# 100 轮预热 + 100 轮正式 = 200 次提交，至少尝试过一次另一臂的概率约 99%（p=0.025 时
# 1−0.975^200）。高并发度的档因此拿到远超所需的探索次数（100 轮 × 64 = 6400 次），这是刻意的：
# 预热轮数按判定档定，其余档跟着走，省下来的时间抵不上再引入一个"按并发度定预热"的配置项。
# 仍没走到的规模如实标为「另一臂未被尝试」，不是失败、也不隐瞒（见 `line.py` 的收敛判据）。
native_line:
  registers: [1, 8, 125]
  warmup_rounds: 100
  measured_rounds: 100
