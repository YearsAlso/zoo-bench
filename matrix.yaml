# zoo-bench 测量矩阵
#
# 被测目标清单。两种写法都支持：
#   `包名==版本`                         —— PyPI 上已发布的版本
#   `包名 @ git+<仓库地址>@<分支/标签>`   —— 某个 git 引用的 HEAD
#
# **两者都要**：已发布版本是读者能装到的东西，仓库分支是"还没发但已经改了"的状态；
# 只测前者会让报告落后于开发，只测后者则报告里没有可安装的对应物。
#
# 跨版本对比只要两边的**留档**都在即可（`zoo-bench compare` 读留档，不重新测量），
# 所以上一版不必留在本清单里——它的数据已经在 results/ 下。
#
# 版本号必须真实存在（PyPI）或引用必须真实存在（git），否则安装失败。核对可用版本：
#   uv pip index versions zoo-framework
# 不要照抄框架仓库 pyproject.toml 里的版本号——实测它与 PyPI 上的发行版对不上。
frameworks:
  - "zoo-framework==0.6.0"
  # 0.7.x 需要先适配适配器才能测——见下方说明
  # - "zoo-framework==0.7.1b0"
  # - "zoo-framework @ git+https://github.com/YearsAlso/zoo-framework.git@dev"

# **为什么 0.7.x 目前不在清单里**（2026-10-04 实测）
#
# 装上 0.7.1b0 后跑用例，13 条立刻失败，根因是**派发面变了**：
#   AttributeError: property 'workers' of 'BaseWaiter' object has no setter
# 0.6.0 里 `BaseWaiter.workers` / `worker_props` 是可写属性（适配器靠赋值驱动），0.7.1 改成
# **只读属性**，替代入口是 `call_workers(worker_list)`；而我的完成信号观测点
# `worker_running_callback` 已不在 0.7.1 的公开面上。0.7.x 的 waiter 还引入了
# `dispatch_core` / `scheduler_model` 的组合结构，池与模式的配置方式也随之变了。
#
# 这正是 design 那条风险（"适配器的驱动假设会随被测版本改变"）的实例，而"追加版本必须重跑
# 等价性用例"这条判据如实把它拦下了。**加版本的正确顺序是先装上它跑一遍用例，再改矩阵**——
# 这次把顺序做反了（先改矩阵、后装它跑），好在推送前发现。
#
# 要做的是让 zoo 适配器**按版本分流**（0.6.x 走赋值、0.7.x 走 call_workers 并换完成信号），
# 而不是二选一——清单里同时存在两个大版本正是这套 harness 的目的之一。

# 并发度档位
concurrency: [1, 4, 16, 64]

# 执行体耗时档位（微秒）。对应 bench/ 实测的 cpu-1x / cpu-10x / cpu-100x / io-10ms 四档。
body_tiers_us: [40, 300, 2700, 10000]

# 参与默认测量的适配器。
#
# **留空即"全部已登记适配器"**——刻意不在这里手维护一份清单：实测过它的代价，早先这份清单是
# 在 zoo 适配器存在之前写的，后来加了 zoo 却忘了同步，于是 CI 跑出的 80 个单元里**一个被测
# 对象都没有**（门禁拦住了那份报告，但理由说的是"没有不利数据"，误导排查方向）。
# 需要跑子集时再显式列出。
#
# 需外部服务的方案（celery）不受影响：它的可选依赖缺失时本就不会被登记（design D3）。
# adapters:
#   - zoo
#   - bare_thread
