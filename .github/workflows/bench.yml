name: bench

# 只在主分支推送与手动触发时跑。
# 刻意**不**跟 PyPI 最新版：要测哪些版本写在 matrix.yaml 里（design D8），
# 本工作流通过 `zoo-bench frameworks` 读它——因此这里不出现任何框架版本号字面量。
on:
  workflow_dispatch:
  push:
    branches: [main]
    # **防循环用声明式的路径过滤，不用提交信息里的跳过关键词。**
    # 实测踩过这个坑：归档提交原先在信息里写那个关键词，而那次提交的正文正好**在论证这个
    # 标记**，于是关键词被读走、整次推送被静默跳过——随后 push 的六个提交一个都没触发工作流，
    # 直到查 run 列表才发现。关键词的根本毛病是**文本匹配**：任何人把"跳过构建"这件事写进提交
    # 信息就会误伤。路径过滤只排除"仅改动 results/ 的推送"，语义与要防的事情完全一致。
    paths-ignore:
      - "results/**"

# 权限说明：`contents: write` 用于**把留档提交回本仓库**（见「归档原始数据」那一步）——
# "报告可追溯到原始数据"对读者必须成立，而 CI 产物要登录才能下载。这**不是**跨仓库写回：
# design D9 禁的是向框架仓库回写（那需要 PAT、会产生跨仓 bot commit），本仓库自己归档自己
# 的数据是正常做法。其余仍只读。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bench:
    # 固定原生 Linux：WSL2 会放大跨线程唤醒约 3 倍，Windows/macOS 的数字与 Linux 不可混排，
    # 故这里不建平台矩阵（design D6 的同一次运行内自洽要求）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装中文字体
        # runner 默认**没有**中文字体，图表与报告会变成方框。两个包都要：
        # - fonts-noto-cjk：matplotlib 出图用（CFF 轮廓，它也认）
        # - fonts-wqy-zenhei：**PDF 用**——reportlab 只能嵌 TrueType 轮廓，CFF 的 noto 不行
        # 装齐后导出在缺字体时仍会明确失败（见 zoo_bench.render.fonts）——失败好过静默产出方框。
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: 安装 zoo-bench
        run: python -m pip install ".[dev]"

      - name: 逐个测量矩阵里的版本
        # 版本清单来自 matrix.yaml（经 CLI 读取），不是抄在这个文件里。
        # 单个版本失败**不中断**其余版本——已测出的数据比一个整齐的红色作业更有用；
        # 但末尾会以失败结束，使"有版本没测成"不会被当作成功。
        run: |
          set -u
          mkdir -p site
          # 原生任务线的扩展要从**框架仓**的同一引用装（理由见循环里的说明），而仓库地址**只声明
          # 在矩阵的那条 git 引用条目里**（design D9 的"同源"靠的就是它），这里从矩阵读出来，
          # 不在本文件里再写一份——另写一份不会跟着矩阵改，也照样得在改矩阵时被想起来。
          repo=$(python -c "from zoo_bench import matrix as m; from zoo_bench.targets import parse_target as p; \
            specs=[item for item in m.load().frameworks if 'git+' in item]; print(p(specs[0]).url if specs else '')")
          failed=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            echo "::group::测量 $framework"

            # 换目标前**显式卸掉**上一个。不能指望 `pip install` 换装：矩阵里两个条目声明的
            # 版本号可能相同（实测 dev 分支的 pyproject 与已发布的 0.7.1b0 都声明 0.7.1b0），
            # 而 pip 在版本号相同时把直接引用当成"已满足"——实测 `pip install "...@dev"` 退出码
            # 0、只打传递依赖的 already satisfied、**根本不装目标**。留下的还是上一个目标的
            # dist-info，于是 `_verify_installed` 如实判否，而那句"请先安装"会把人引到一条
            # 空操作上（照做仍然什么都不换）。包名从规格里取，与本文件"不出现版本字面量"
            # 的约定一致。
            name=$(python -c \
              "from zoo_bench.targets import parse_target; print(parse_target('''$framework''').name)")
            python -m pip uninstall -y "$name" || true
            python -m pip install "$framework"

            # 原生任务线的扩展（design D9）：从框架仓**同一引用**的 `native/` 子目录直装，
            # maturin 就地构建——编译发生在计时之前，不进计时区间。期望引用由
            # `expected_extension_revision` 从框架规格推出（PyPI 目标的约定是 tag `v<版本>`），
            # 仓库地址由上面从矩阵读出；**两样都不在本文件里另写**，本文件照旧不出现版本字面量。
            #
            # 只在「该线开着 + 被测版本具备该能力」时装：0.10.0 及更早没有这套符号，该线本就会
            # 如实报"不适用"，装上去只是白烧一次编译（那些 tag 下也根本没有 `native/` 子目录）；
            # 矩阵里删掉 `native_line` 一节即关线，那时同样不必装。
            #
            # 换目标前**显式卸掉**扩展，理由与框架那条同源（见上）：不同目标的扩展声明的是
            # **同一个版本号**，pip 在版本号相同时会把直接引用当成"已满足"而根本不换，留下的
            # 还是上一个目标的扩展。那会被该线判为"来源与被测框架不对应"——判否本身是设计要的，
            # 但成因是安装没换掉，那是一条假红。包名同样取自本仓唯一声明它的地方。
            #
            # 装不上**不**计入 failed：该线的失败不扩散到主矩阵与其余版本（design D12），
            # 由该线自身如实报失败、报告里带原因；这里再出告警注释，免得它以"线没开"的样子
            # 静默消失（不出声的失败与"不必测"在日志里看不出区别）。
            #
            # 该线在 CI 上也 MUST NOT 配置统计落盘路径（design D6）：本工作流**不给框架摆任何
            # 配置**——开关组合由该线自带的临时配置目录决定（那里只会有它自己的 config.json），
            # 故这里没有、也不要加 `adaptive:statsPath` 之类的配置入口。判据在配置层
            # （`native_line/config.py` 的 `verify_switches`：声明了该路径即整线判失败并给出路径），
            # 落盘与否只作旁证——旁证由本步之后的「核验……无新增文件」一步在同一台机器上取。
            if python -c "import sys; from zoo_bench import matrix as m; from zoo_bench.native_line.measure import probe_capability_symbols as probe; \
              plan=m.native_line_plan(m.load()); sys.exit(0 if plan is not None and probe()['present'] else 1)"; then
              revision=$(python -c \
                "from zoo_bench.native_line.measure import expected_extension_revision; print(expected_extension_revision('''$framework''') or '')")
              if [ -n "$repo" ] && [ -n "$revision" ]; then
                extension=$(python -c \
                  "from zoo_bench.native_line.measure import extension_source; print(extension_source()['package'])")
                python -m pip uninstall -y "$extension" || true
                python -m pip install "$extension @ git+$repo@$revision#subdirectory=native" || \
                  echo "::warning::$framework 的原生扩展（引用 $revision）装不上——原生任务线会如实报失败并给出原因，主矩阵与其余版本不受影响"
              else
                echo "::warning::取不到扩展的仓库地址或 $framework 对应的引用，跳过扩展安装——该线会如实报失败，主矩阵与其余版本不受影响"
              fi
            fi

            # 输出目录取框架规格的 slug，与 storage.framework_slug 同一套规则
            slug=$(python -c \
              "from zoo_bench.storage import framework_slug; print(framework_slug('$framework'))")

            zoo-bench run --framework "$framework" || failed="$failed run:$framework"
            zoo-bench render --framework "$framework" --out "site/$slug" \
              || failed="$failed render:$framework"

            echo "::endgroup::"
          done < <(zoo-bench frameworks)

          if [ -n "$failed" ]; then
            echo "::error::以下步骤未完成：$failed"
            exit 1
          fi

      - name: 生成跨版本对比
        # 「每个版本完成后给出一个性能提升报告」那条用途的落点：把矩阵里**相邻两个目标**的对比
        # 做成页面放进站点。对比只读留档、不重新测量（`compare` 做的是聚合），故这一步很便宜。
        # **相邻 = 矩阵里的书写顺序**，不在这里另立一份"要比哪几对"的清单——两处真源必然漂移；
        # 想改对比对象就改矩阵里的顺序。
        run: |
          set -u
          failed=""
          previous=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            if [ -n "$previous" ]; then
              old=$(python -c \
                "from zoo_bench.storage import framework_slug; print(framework_slug('''$previous'''))")
              new=$(python -c \
                "from zoo_bench.storage import framework_slug; print(framework_slug('''$framework'''))")
              if ! zoo-bench compare "$previous" "$framework" --out "site/compare-$old--$new"; then
                failed="$failed compare:$old..$new"
              fi
            fi
            previous="$framework"
          done < <(zoo-bench frameworks)

          if [ -n "$failed" ]; then
            echo "::error::以下步骤未完成：$failed"
            exit 1
          fi

      # ------------------------------------------------------------------ free-threaded 列
      #
      # 框架仓库变更 align-execution-primitives 任务组 6：回答「同机同负载
      # 3.13 vs 3.13t 的 zoo 端到端差」。判读门槛：中位收益 >=15% 才讨论
      # 「把 3.13t 列为支持目标」，否则此列转长期观测。
      #
      # **只测矩阵里的 git 引用条目（@dev）**：已发布版本声明 gevent 依赖，
      # 而 gevent/greenlet 在 free-threaded 构建上装不上，进矩阵必整列红。
      # 目标清单经 `zoo-bench frameworks | grep ' @ '` 筛选得出，本文件仍不出现
      # 任何框架版本字面量（与上方循环同一约定）。
      #
      # 留档走 results/gil-free/、报告走 site/<slug>-gil-free/：不与 3.13 列互盖。
      # continue-on-error：runner 没有 3.13t 产物时不摧毁整条 Pages 流水线——
      # 失败以橙色步骤如实可见，不造数据。
      #
      # 原生任务线在这一列会报"扩展不可加载"：本列不装扩展（那是为 3.13 构建的 cdylib，
      # 3.13t 上要另一份产物，本列的目的只是解释器对照），该线因此如实判失败而**不出数字**，
      # 也不影响这一列其余测量与发布（design D12）。这是预期形态，不是这一列坏了。

      - name: 设置 free-threaded 解释器（3.13t）
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.13t"

      - name: 安装 zoo-bench（free-threaded）
        continue-on-error: true
        run: |
          set -u
          # 框架先行：zoo-bench 声明 "zoo-framework"（不固定版本），harness 先装
          # 会从 PyPI 拉 0.8.0 —— 它声明 gevent，在 3.13t 上装不上（本机实测）。
          # 先装矩阵里的 git 引用条目（去 gevent 后的 dev），harness 依赖即被满足。
          framework=$(grep -o '"zoo-framework @ [^"]*"' matrix.yaml | tr -d '"')
          if [ -z "$framework" ]; then
            echo "::warning::矩阵里没有 git 引用条目，跳过 free-threaded 列"
            exit 1
          fi
          python -m pip install "$framework"
          # wheel 边界（2026-10-06 本机 cp313t 实测）：最新 numpy/matplotlib/pillow
          # 没有 free-threaded 产物时 pip 退回源码构建并失败；先钉到有产物的区间。
          python -m pip install "numpy<2.5" "matplotlib<3.11" "pillow<12"
          python -m pip install ".[dev]"

      - name: 测量 free-threaded 列
        continue-on-error: true
        run: |
          set -u
          mkdir -p site
          failed=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            echo "::group::测量（3.13t）$framework"

            name=$(python -c \
              "from zoo_bench.targets import parse_target; print(parse_target('''$framework''').name)")
            python -m pip uninstall -y "$name" || true
            python -m pip install "$framework"

            slug=$(python -c \
              "from zoo_bench.storage import framework_slug; print(framework_slug('''$framework'''))")

            zoo-bench run --framework "$framework" --out results/gil-free \
              || failed="$failed run-313t:$framework"
            zoo-bench render --framework "$framework" --results results/gil-free \
              --out "site/$slug-gil-free" || failed="$failed render-313t:$framework"

            echo "::endgroup::"
          done < <(zoo-bench frameworks | grep ' @ ' || true)

          if [ -n "$failed" ]; then
            echo "::warning::free-threaded 列未完成：$failed"
            exit 1
          fi

      - name: 核验原生任务线的测量目录无新增文件
        # design D6 的**旁证**（判据在配置层，见测量步骤里的说明）。该线每个子进程都先建一个
        # 临时目录、把开关组合摆成那里的 config.json，再**切目录并跑在那里**——故"计时区间内
        # 有没有发生 I/O"最直接的痕迹就是这些目录：除 config.json 之外多出任何文件都值得看一眼
        # （统计落盘路径若被配上，写出来的东西会落在这一处）。
        #
        # 与分目录名同一个来源（`native_line/config.py` 的 `CONFIG_DIR_PREFIX` / `CONFIG_FILENAME`），
        # 这里不另写一份。目录名不必是本轮新建的：同一台机器上历轮留下的都看（前缀相同）。
        #
        # 放在 free-threaded 列之后：那一列同样跑该线，它的临时目录也在同一处。
        # 出告警**不出失败**：这是旁证，不该挡住其余版本已经测出来的数据发布（design D12）；
        # 真被配上了统计路径时，该线自身已经判失败并在报告里给出那个路径。
        if: always()
        run: |
          set -u
          python - <<'PY'
          import pathlib
          import tempfile

          from zoo_bench.native_line.config import CONFIG_DIR_PREFIX, CONFIG_FILENAME

          root = pathlib.Path(tempfile.gettempdir())
          staged = sorted(item for item in root.glob(f"{CONFIG_DIR_PREFIX}*") if item.is_dir())
          stray = {
              str(directory): extra
              for directory in staged
              if (extra := sorted(item.name for item in directory.iterdir() if item.name != CONFIG_FILENAME))
          }
          print(f"该线的临时测量目录：{len(staged)} 个")
          for directory, extra in stray.items():
              print(f"::warning::原生任务线的测量目录 {directory} 除 {CONFIG_FILENAME} 外还有 {extra}")
          if not stray:
              print(f"每个目录的内容都只有 {CONFIG_FILENAME}")
          PY

      - name: 写站点首页
        # 放在 free-threaded 列之后：首页收录全部已生成的报告列（含 <slug>-gil-free），
        # 否则新列的数据在留档里、却不在导航里。
        run: zoo-bench index --site site

      - name: 归档原始数据
        # 「报告可追溯到原始数据」对读者必须成立，而 CI 产物下载需要登录——故把留档提交进
        # 本仓库，使它公开可见、且有版本历史。
        #
        # **防循环在触发器上**（见文件顶部的 paths-ignore）：这次提交只改 results/，那次推送
        # 因此不会触发本工作流。刻意**不**在提交信息里写任何跳过关键词——那是文本匹配，写下
        # 论证它的文字本身就会误伤（实测踩过）。
        run: |
          git config user.name "zoo-bench"
          git config user.email "zoo-bench@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "留档无变化，跳过提交"
          else
            git commit -m "chore(results): 归档 $(date -u +%Y-%m-%dT%H:%MZ) 的测量数据"
            git push
          fi

      - name: 保存原始数据
        # 除了进仓库，同时作为产物保留：留档是这套东西存在的理由——渲染出的报告可以重来，
        # 原始数据不能。自检失败时，排查只能靠它。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoo-bench-results
          path: results
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
