name: bench

# 只在主分支推送与手动触发时跑。
# 刻意**不**跟 PyPI 最新版：要测哪些版本写在 matrix.yaml 里（design D8），
# 本工作流通过 `zoo-bench frameworks` 读它——因此这里不出现任何框架版本号字面量。
on:
  workflow_dispatch:
  push:
    branches: [main]

# 只读仓库内容 + 发布 Pages。**不含对任何其他仓库的写权限**（design D9）：
# 报告发布不需要回写框架仓库，因此既不需要 PAT，也不会产生 bot commit。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bench:
    # 固定原生 Linux：WSL2 会放大跨线程唤醒约 3 倍，Windows/macOS 的数字与 Linux 不可混排，
    # 故这里不建平台矩阵（design D6 的同一次运行内自洽要求）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装中文字体
        # runner 默认**没有**中文字体，图表与报告会变成方框。装它，并且让导出在缺字体时
        # 明确失败（见 zoo_bench.render.fonts）——失败好过静默产出方框。
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安装 zoo-bench
        run: python -m pip install ".[dev]"

      - name: 逐个测量矩阵里的版本
        # 版本清单来自 matrix.yaml（经 CLI 读取），不是抄在这个文件里。
        # 单个版本失败**不中断**其余版本——已测出的数据比一个整齐的红色作业更有用；
        # 但末尾会以失败结束，使"有版本没测成"不会被当作成功。
        run: |
          set -u
          mkdir -p site
          failed=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            echo "::group::测量 $framework"

            python -m pip install "$framework"

            # 输出目录取框架规格的 slug，与 storage.framework_slug 同一套规则
            slug=$(python -c \
              "from zoo_bench.storage import framework_slug; print(framework_slug('$framework'))")

            zoo-bench run --framework "$framework" || failed="$failed run:$framework"
            zoo-bench render --framework "$framework" --out "site/$slug" \
              || failed="$failed render:$framework"

            echo "::endgroup::"
          done < <(zoo-bench frameworks)

          if [ -n "$failed" ]; then
            echo "::error::以下步骤未完成：$failed"
            exit 1
          fi

      - name: 写站点首页
        run: zoo-bench index --site site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
