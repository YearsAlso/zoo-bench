name: bench

# 只在主分支推送与手动触发时跑。
# 刻意**不**跟 PyPI 最新版：要测哪些版本写在 matrix.yaml 里（design D8），
# 本工作流通过 `zoo-bench frameworks` 读它——因此这里不出现任何框架版本号字面量。
on:
  workflow_dispatch:
  push:
    branches: [main]
    # **防循环用声明式的路径过滤，不用提交信息里的跳过关键词。**
    # 实测踩过这个坑：归档提交原先在信息里写那个关键词，而那次提交的正文正好**在论证这个
    # 标记**，于是关键词被读走、整次推送被静默跳过——随后 push 的六个提交一个都没触发工作流，
    # 直到查 run 列表才发现。关键词的根本毛病是**文本匹配**：任何人把"跳过构建"这件事写进提交
    # 信息就会误伤。路径过滤只排除"仅改动 results/ 的推送"，语义与要防的事情完全一致。
    paths-ignore:
      - "results/**"

# 权限说明：`contents: write` 用于**把留档提交回本仓库**（见「归档原始数据」那一步）——
# "报告可追溯到原始数据"对读者必须成立，而 CI 产物要登录才能下载。这**不是**跨仓库写回：
# design D9 禁的是向框架仓库回写（那需要 PAT、会产生跨仓 bot commit），本仓库自己归档自己
# 的数据是正常做法。其余仍只读。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bench:
    # 固定原生 Linux：WSL2 会放大跨线程唤醒约 3 倍，Windows/macOS 的数字与 Linux 不可混排，
    # 故这里不建平台矩阵（design D6 的同一次运行内自洽要求）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装中文字体
        # runner 默认**没有**中文字体，图表与报告会变成方框。两个包都要：
        # - fonts-noto-cjk：matplotlib 出图用（CFF 轮廓，它也认）
        # - fonts-wqy-zenhei：**PDF 用**——reportlab 只能嵌 TrueType 轮廓，CFF 的 noto 不行
        # 装齐后导出在缺字体时仍会明确失败（见 zoo_bench.render.fonts）——失败好过静默产出方框。
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: 安装 zoo-bench
        run: python -m pip install ".[dev]"

      - name: 逐个测量矩阵里的版本
        # 版本清单来自 matrix.yaml（经 CLI 读取），不是抄在这个文件里。
        # 单个版本失败**不中断**其余版本——已测出的数据比一个整齐的红色作业更有用；
        # 但末尾会以失败结束，使"有版本没测成"不会被当作成功。
        run: |
          set -u
          mkdir -p site
          failed=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            echo "::group::测量 $framework"

            # 换目标前**显式卸掉**上一个。不能指望 `pip install` 换装：矩阵里两个条目声明的
            # 版本号可能相同（实测 dev 分支的 pyproject 与已发布的 0.7.1b0 都声明 0.7.1b0），
            # 而 pip 在版本号相同时把直接引用当成"已满足"——实测 `pip install "...@dev"` 退出码
            # 0、只打传递依赖的 already satisfied、**根本不装目标**。留下的还是上一个目标的
            # dist-info，于是 `_verify_installed` 如实判否，而那句"请先安装"会把人引到一条
            # 空操作上（照做仍然什么都不换）。包名从规格里取，与本文件"不出现版本字面量"
            # 的约定一致。
            name=$(python -c \
              "from zoo_bench.targets import parse_target; print(parse_target('''$framework''').name)")
            python -m pip uninstall -y "$name" || true
            python -m pip install "$framework"

            # 输出目录取框架规格的 slug，与 storage.framework_slug 同一套规则
            slug=$(python -c \
              "from zoo_bench.storage import framework_slug; print(framework_slug('$framework'))")

            zoo-bench run --framework "$framework" || failed="$failed run:$framework"
            zoo-bench render --framework "$framework" --out "site/$slug" \
              || failed="$failed render:$framework"

            echo "::endgroup::"
          done < <(zoo-bench frameworks)

          if [ -n "$failed" ]; then
            echo "::error::以下步骤未完成：$failed"
            exit 1
          fi

      - name: 生成跨版本对比
        # 「每个版本完成后给出一个性能提升报告」那条用途的落点：把矩阵里**相邻两个目标**的对比
        # 做成页面放进站点。对比只读留档、不重新测量（`compare` 做的是聚合），故这一步很便宜。
        # **相邻 = 矩阵里的书写顺序**，不在这里另立一份"要比哪几对"的清单——两处真源必然漂移；
        # 想改对比对象就改矩阵里的顺序。
        run: |
          set -u
          failed=""
          previous=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            if [ -n "$previous" ]; then
              old=$(python -c \
                "from zoo_bench.storage import framework_slug; print(framework_slug('''$previous'''))")
              new=$(python -c \
                "from zoo_bench.storage import framework_slug; print(framework_slug('''$framework'''))")
              if ! zoo-bench compare "$previous" "$framework" --out "site/compare-$old--$new"; then
                failed="$failed compare:$old..$new"
              fi
            fi
            previous="$framework"
          done < <(zoo-bench frameworks)

          if [ -n "$failed" ]; then
            echo "::error::以下步骤未完成：$failed"
            exit 1
          fi

      # ------------------------------------------------------------------ free-threaded 列
      #
      # 框架仓库变更 align-execution-primitives 任务组 6：回答「同机同负载
      # 3.13 vs 3.13t 的 zoo 端到端差」。判读门槛：中位收益 >=15% 才讨论
      # 「把 3.13t 列为支持目标」，否则此列转长期观测。
      #
      # **只测矩阵里的 git 引用条目（@dev）**：已发布版本声明 gevent 依赖，
      # 而 gevent/greenlet 在 free-threaded 构建上装不上，进矩阵必整列红。
      # 目标清单经 `zoo-bench frameworks | grep ' @ '` 筛选得出，本文件仍不出现
      # 任何框架版本字面量（与上方循环同一约定）。
      #
      # 留档走 results/gil-free/、报告走 site/<slug>-gil-free/：不与 3.13 列互盖。
      # continue-on-error：runner 没有 3.13t 产物时不摧毁整条 Pages 流水线——
      # 失败以橙色步骤如实可见，不造数据。

      - name: 设置 free-threaded 解释器（3.13t）
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.13t"

      - name: 安装 zoo-bench（free-threaded）
        continue-on-error: true
        run: |
          set -u
          # 框架先行：zoo-bench 声明 "zoo-framework"（不固定版本），harness 先装
          # 会从 PyPI 拉 0.8.0 —— 它声明 gevent，在 3.13t 上装不上（本机实测）。
          # 先装矩阵里的 git 引用条目（去 gevent 后的 dev），harness 依赖即被满足。
          framework=$(grep -o '"zoo-framework @ [^"]*"' matrix.yaml | tr -d '"')
          if [ -z "$framework" ]; then
            echo "::warning::矩阵里没有 git 引用条目，跳过 free-threaded 列"
            exit 1
          fi
          python -m pip install "$framework"
          # wheel 边界（2026-10-06 本机 cp313t 实测）：最新 numpy/matplotlib/pillow
          # 没有 free-threaded 产物时 pip 退回源码构建并失败；先钉到有产物的区间。
          python -m pip install "numpy<2.5" "matplotlib<3.11" "pillow<12"
          python -m pip install ".[dev]"

      - name: 测量 free-threaded 列
        continue-on-error: true
        run: |
          set -u
          mkdir -p site
          failed=""
          while read -r framework; do
            [ -n "$framework" ] || continue
            echo "::group::测量（3.13t）$framework"

            name=$(python -c \
              "from zoo_bench.targets import parse_target; print(parse_target('''$framework''').name)")
            python -m pip uninstall -y "$name" || true
            python -m pip install "$framework"

            slug=$(python -c \
              "from zoo_bench.storage import framework_slug; print(framework_slug('''$framework'''))")

            zoo-bench run --framework "$framework" --out results/gil-free \
              || failed="$failed run-313t:$framework"
            zoo-bench render --framework "$framework" --results results/gil-free \
              --out "site/$slug-gil-free" || failed="$failed render-313t:$framework"

            echo "::endgroup::"
          done < <(zoo-bench frameworks | grep ' @ ' || true)

          if [ -n "$failed" ]; then
            echo "::warning::free-threaded 列未完成：$failed"
            exit 1
          fi

      - name: 写站点首页
        # 放在 free-threaded 列之后：首页收录全部已生成的报告列（含 <slug>-gil-free），
        # 否则新列的数据在留档里、却不在导航里。
        run: zoo-bench index --site site

      - name: 归档原始数据
        # 「报告可追溯到原始数据」对读者必须成立，而 CI 产物下载需要登录——故把留档提交进
        # 本仓库，使它公开可见、且有版本历史。
        #
        # **防循环在触发器上**（见文件顶部的 paths-ignore）：这次提交只改 results/，那次推送
        # 因此不会触发本工作流。刻意**不**在提交信息里写任何跳过关键词——那是文本匹配，写下
        # 论证它的文字本身就会误伤（实测踩过）。
        run: |
          git config user.name "zoo-bench"
          git config user.email "zoo-bench@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "留档无变化，跳过提交"
          else
            git commit -m "chore(results): 归档 $(date -u +%Y-%m-%dT%H:%MZ) 的测量数据"
            git push
          fi

      - name: 保存原始数据
        # 除了进仓库，同时作为产物保留：留档是这套东西存在的理由——渲染出的报告可以重来，
        # 原始数据不能。自检失败时，排查只能靠它。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoo-bench-results
          path: results
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
